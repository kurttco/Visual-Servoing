color_features_detector:
  ros__parameters:
    image_topic: "/video_source/raw"

    green_h_min: 40
    green_s_min: 50
    green_v_min: 40
    green_h_max: 90
    green_s_max: 255
    green_v_max: 255

    blue_h_min: 90
    blue_s_min: 50
    blue_v_min: 35
    blue_h_max: 135
    blue_s_max: 255
    blue_v_max: 255

    min_target_area_px: 250.0
    min_obstacle_area_px: 200.0
    morph_kernel_size: 5
    roi_y_min_frac: 0.0
    roi_y_max_frac: 1.0


safe_vs_controller:
  ros__parameters:
    image_width: 640
    image_center_u: -1.0

    # ============================================================
    # Camera and target model — used by the MPC image Jacobian
    # ============================================================
    # Calibrate focal_length_px: place target at Z=1.0 m, read sqrt_area,
    # then f = sqrt_area * 1.0 / target_real_side_m
    focal_length_px: 600.0
    target_real_side_m: 0.15

    # Desired standoff: place robot at goal distance and read
    # sqrt_area from /target_features, then set that value here.
    sqrt_area_star: 850.0
    target_area_deadband: 8.0
    target_center_deadband_px: 25.0

    # ============================================================
    # MPC — horizon, weights, actuator constraints
    # ============================================================
    mpc_horizon_N: 8
    mpc_dt_s: 0.10

    # Tracking weights (Q matrix diagonal).
    # Q_u penalises lateral centering error (pixels).
    # Q_A penalises depth error (sqrt of pixel area).
    Q_u: 1.0
    Q_A: 5.0

    # Control effort weights (R matrix diagonal).
    # High values keep commands conservative.
    # Lower R_v / R_w for more aggressive response.
    R_v: 30000.0
    R_w: 5000.0

    # Slew weights (S matrix diagonal).
    # Penalise step-to-step command changes for smooth motion.
    S_v: 50.0
    S_w: 50.0

    # Actuator limits
    v_max: 0.18        # m/s
    w_max: 0.45        # rad/s

    # Coupled bridge constraint (PuzzleBot firmware limit).
    # |v|/k_lin + |omega|/k_ang <= max_cmd_couple
    k_lin: 0.074
    k_ang: 0.561
    max_cmd_couple: 2.8

    # ============================================================
    # Acquisition / timeout
    # ============================================================
    acquire_w: 0.30
    feature_timeout_s: 0.8

    # ============================================================
    # Blue obstacle trigger
    # ============================================================
    obstacle_enable: true
    obstacle_min_sqrt_area: 150.0
    obstacle_center_band_frac: 0.90
    obstacle_priority_over_lost: true
    avoid_cooldown_s: 2.0

    # ============================================================
    # APPROACH_OBSTACLE
    # ============================================================
    approach_obs_v: 0.07
    approach_obs_kp_w: 0.0025
    approach_obs_sqrt_area: 350.0
    approach_obs_max_duration_s: 6.0

    # ============================================================
    # Square bypass
    # ============================================================
    square_turn_w: 0.45
    square_turn_duration_s: 3.5
    square_leg_v: 0.10
    square_leg_1_duration_s: 2.5
    square_leg_2_duration_s: 3.0

    hold_required_frames: 10
    control_rate_hz: 10.0
    v_slew_rate: 0.18
    w_slew_rate: 0.80

    # ============================================================
    # CSV logging
    # ============================================================
    log_csv: true
    log_dir: "/tmp/puzzlebot_logs"


cmd_vel_to_wheels:
  ros__parameters:
    k_lin: 0.074
    k_ang: 0.561
    max_wheel_cmd: 2.8
